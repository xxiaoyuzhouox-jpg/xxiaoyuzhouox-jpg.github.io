<script id="curriculum" type="application/json">{"levels":{"en":[{"code":"A0","label":"发音与表达起步","goal":"听清常见音，完整表达个人信息和基本需要。","skills":["拼读与重音","be / have / can","陈述与问句","日常固定搭配"],"exit":"面对慢速对话，理解要点并独立介绍自己 90 秒"},{"code":"A1","label":"日常生存交流","goal":"能处理购物、问路、预约、吃饭等高频场景。","skills":["一般现在与过去","提问与回答","可数与不可数","发音连读初识"],"exit":"完成 5 分钟有来有往的日常情境对话"},{"code":"A2","label":"连续表达与叙事","goal":"描述经历、计划和理由，理解清楚的日常对话。","skills":["过去/将来与进行体","比较与条件句","现在完成时","段落组织"],"exit":"复述一段 2 分钟慢速材料并说出自己的观点"},{"code":"B1","label":"独立沟通","goal":"适应标准语速，讨论工作、兴趣及陌生生活问题。","skills":["从句与时态组合","观点与论证","连接与省音","转述/解释"],"exit":"看 5 分钟真实访谈，准确抓主旨并持续交流 10 分钟"},{"code":"B2","label":"自然对话与影视","goal":"理解隐含态度、自然语速和常见俚语；表达逻辑清楚。","skills":["语用与语气","习语/搭配","弱读与吞音","争论与反驳"],"exit":"观看 10 分钟熟悉题材节目，基本不看字幕概述情节"},{"code":"C1+","label":"高阶表达与无字幕","goal":"适应不同口音、复杂叙事和双关；独立理解多数影视内容。","skills":["言外之意与文化语境","隐喻与幽默","方言/口音","深度评论"],"exit":"无字幕观看长片，正确概述人物动机、潜台词与主要细节"}],"ja":[{"code":"入门","label":"五十音与语音","goal":"熟悉假名、节拍、长短音、促音、声调意识与基本句型。","skills":["平片假名","助词 は / か","です / ます","长音促音与拨音"],"exit":"识读常见假名并完成 1 分钟日语自我介绍"},{"code":"N5/A1","label":"基础生活会话","goal":"表达需求、喜好、位置、时间，理解简短日常对话。","skills":["助词 に/で/を","形容词与动词活用","て形入门","数字量词"],"exit":"完成问路、点餐、购物等情景对话"},{"code":"N4/A2","label":"经历与计划","goal":"能解释原因、表达希望、讲述过去与将来。","skills":["普通形","と思う / から","可能与意向","たことがある"],"exit":"用日语连续讲述 2 分钟日常事件"},{"code":"N3/B1","label":"独立交流","goal":"理解标准语速中大部分核心信息，能展开意见交流。","skills":["条件与被动","授受与敬语基础","言い換え","段落与主旨"],"exit":"听懂中速对话要点并持续交谈 8 分钟"},{"code":"N2/B2","label":"自然日语与媒体","goal":"理解语气、委婉表达、主流媒体和影视的核心情节。","skills":["书面与口语差异","推量与话语功能","省略表达","影视常见口头语"],"exit":"无字幕理解熟悉主题视频的大意与人物关系"},{"code":"N1+/C1","label":"高阶理解与无字幕","goal":"适应快速对白、文化暗示、角色语言与复杂观点。","skills":["隐含态度与反讽","正式辩论","省略与方言","篇章分析"],"exit":"无字幕看整部电影，准确解释动机、立场和细节"}]},"lessons":[{"id":"en-0-1","lang":"en","level":0,"title":"自我介绍与信息交换","grammar":"I am / I live / I work","explain":"用 I am 说身份、用 I live 说居住地。问句 What do you do? 是询问职业，重读信息词。","goal":"不看文字，能介绍身份、城市和自己的学习目的。","dialogue":[{"t":"Hi, I’m Alex. What’s your name?","zh":"你好，我叫亚历克斯。你叫什么？"},{"t":"I’m Lin. Nice to meet you.","zh":"我叫林。很高兴认识你。"},{"t":"Nice to meet you too. Where do you live?","zh":"我也很高兴认识你。你住在哪里？"},{"t":"I live in Tokyo, and I’m learning English.","zh":"我住在东京，正在学英语。"}],"quiz":"Where does Lin live?","options":["In London","In Tokyo","In New York"],"answer":1,"speaking":"介绍你的姓名、所在地、学习目标，并向对方提一个问题。","writing":"用 4 句英语写自我介绍，并加上一句为什么学英语。","model":"I live in Tokyo. I work in design. I’m learning English because I want to enjoy films without subtitles.","reading":"先听三遍，抓姓名、城市、目的；再跟读并注意 I’m 的缩读。"},{"id":"en-0-2","lang":"en","level":0,"title":"听懂并提出请求","grammar":"Can I / Could you / Please","explain":"Can I 用于请求许可；Could you 通常更礼貌。听清 can 与 can’t 的重音区别。","goal":"能礼貌求助、听懂肯定和否定答复。","dialogue":[{"t":"Excuse me, could you help me?","zh":"打扰一下，可以帮我吗？"},{"t":"Of course. What do you need?","zh":"当然，你需要什么？"},{"t":"Can you say that again more slowly?","zh":"你能再慢一点说一遍吗？"},{"t":"Sure. I’ll speak more slowly.","zh":"当然，我会说慢一点。"}],"quiz":"What does the speaker ask for?","options":["A seat","Slower speech","A ticket"],"answer":1,"speaking":"向陌生人求助，请他放慢语速，并礼貌道谢。","writing":"用英语写一条向同事礼貌求助的消息。","model":"Could you explain this part again, please? I didn’t catch the last sentence.","reading":"留意 could you 连读时的弱化，不用逐字拆开理解。"},{"id":"en-0-3","lang":"en","level":0,"title":"时间、地点和计划","grammar":"There is / at / on","explain":"There is 表示存在，at 用于具体时间，on 用于星期/日期；先把时间放入一句完整表达。","goal":"能够确认会面时间与地点。","dialogue":[{"t":"Is there a café near the station?","zh":"车站附近有咖啡馆吗？"},{"t":"Yes, there’s one across the street.","zh":"有，街对面就有一家。"},{"t":"Great. Can we meet there at six?","zh":"太好了，我们六点在那里见面可以吗？"},{"t":"Six works for me. See you there!","zh":"六点我可以，到时候见！"}],"quiz":"When will they meet?","options":["At five","At six","At seven"],"answer":1,"speaking":"改约成周末下午三点，说明会面地点。","writing":"写三句包含时间、地点和计划的英文。","model":"Let’s meet outside the library at three on Saturday.","reading":"听数字时不要猜，反复确认具体时间与地点。"},{"id":"en-1-1","lang":"en","level":1,"title":"餐厅点餐与追问","grammar":"I’d like / Would you like / anything else","explain":"I’d like 比 I want 更自然礼貌。点餐之后练习针对食材、价格和推荐追问。","goal":"无需中文，能点餐并确认细节。","dialogue":[{"t":"Are you ready to order?","zh":"您准备好点餐了吗？"},{"t":"Yes, I’d like the chicken sandwich, please.","zh":"是的，我想要鸡肉三明治。"},{"t":"Would you like anything to drink?","zh":"您还想喝点什么吗？"},{"t":"Just water, thanks. Does the sandwich come with salad?","zh":"水就好，谢谢。三明治配沙拉吗？"}],"quiz":"What drink does the customer choose?","options":["Coffee","Water","Orange juice"],"answer":1,"speaking":"你对坚果过敏。向服务员点餐并询问菜品是否含坚果。","writing":"写一段 4 轮餐厅对话，包括一次追问。","model":"I’d like the soup, please. Does it contain any nuts?","reading":"先不看文本，辨识点餐、追问、确认三个功能。"},{"id":"en-1-2","lang":"en","level":1,"title":"问路与位置说明","grammar":"Go straight / turn left / next to","explain":"方向词需要在连贯句子里理解；next to / across from / between 表示相对位置。","goal":"能问路、理解三步以内的方向说明。","dialogue":[{"t":"Excuse me, how do I get to the museum?","zh":"请问博物馆怎么走？"},{"t":"Go straight for two blocks, then turn left.","zh":"直走两个街区，然后左转。"},{"t":"Is it far from here?","zh":"离这里远吗？"},{"t":"Not really. It’s next to the city library.","zh":"不算远，就在市图书馆旁边。"}],"quiz":"What is next to the museum?","options":["A hospital","A library","A cinema"],"answer":1,"speaking":"从地铁站向游客介绍去你熟悉的一家商店的路线。","writing":"写出三步路线，包含一个方位介词。","model":"Go past the bank, turn right, and you’ll see it across from the park.","reading":"听懂指路时在脑中形成地图，减少逐词翻译。"},{"id":"en-1-3","lang":"en","level":1,"title":"安排与取消预约","grammar":"Present simple for schedules / Can we…?","explain":"用 Can we move... 或 Would it be possible to... 礼貌改时间；注意口语里的 works for me。","goal":"能打电话预约、改约、确认。","dialogue":[{"t":"Hi, I’m calling about my appointment on Friday.","zh":"你好，我打电话询问周五的预约。"},{"t":"Sure. Do you need to change it?","zh":"好的，您需要改时间吗？"},{"t":"Yes, could we move it to Monday morning?","zh":"是的，可以改到周一早上吗？"},{"t":"Monday at ten is available. Does that work?","zh":"周一十点有空。您方便吗？"}],"quiz":"What new time is available?","options":["Monday at ten","Friday at ten","Sunday at nine"],"answer":0,"speaking":"给理发店打电话，将明天下午的预约改到后天上午。","writing":"写一条确认新预约时间的信息。","model":"Thank you for moving my appointment. Monday at ten works perfectly.","reading":"注意提问语调和数字、日期中的重音。"},{"id":"en-2-1","lang":"en","level":2,"title":"经历、故事与时间顺序","grammar":"Past simple / first / then / eventually","explain":"叙述完整事件时用 first, then, eventually；区分主要事件与补充细节。","goal":"能用至少六句讲一件已经发生的事。","dialogue":[{"t":"How was your trip to Kyoto?","zh":"你的京都之行怎么样？"},{"t":"Amazing. We visited a temple and got lost on the way back.","zh":"非常棒。我们去了寺庙，回来路上迷路了。"},{"t":"Oh no! What happened next?","zh":"天哪！后来呢？"},{"t":"A local showed us the way, and we made it to the station.","zh":"一位当地人给我们指路，我们最后到达车站。"}],"quiz":"Who helped the travelers?","options":["A hotel manager","A local person","A taxi driver"],"answer":1,"speaking":"讲述最近一次意料之外的小事，说清开始、转折和结果。","writing":"写 80 个英文词描述一段旅行或一次意外。","model":"First, we took the wrong train. Then, a helpful stranger explained the route. Eventually, we arrived on time.","reading":"重点捕捉过去时的动词和 What happened next? 所暗示的事件顺序。"},{"id":"en-2-2","lang":"en","level":2,"title":"计划、选择与理由","grammar":"going to / because / if","explain":"把观点、原因与条件连接起来，避免用孤立的短句堆砌。","goal":"能解释选择和未来计划。","dialogue":[{"t":"Are you going to take the early train?","zh":"你打算坐早班火车吗？"},{"t":"I’m not sure. It’s cheaper, but I’d have to wake up at five.","zh":"不确定。它更便宜，但我得五点起床。"},{"t":"What if you take the later one?","zh":"那坐晚一点的车呢？"},{"t":"That might be better because I can get some rest.","zh":"可能更好，因为我可以多休息一会儿。"}],"quiz":"Why is the early train a problem?","options":["It takes longer","It requires waking up early","It is sold out"],"answer":1,"speaking":"比较早班车和晚班车，各给出两个理由并做决定。","writing":"写一个三句的周末计划，包含 because 和 if。","model":"If the weather is nice, I’m going to visit the coast because I need a break.","reading":"留意 but 和 because 之后常出现真正需要理解的信息。"},{"id":"en-2-3","lang":"en","level":2,"title":"经验与变化","grammar":"Present perfect / used to / since","explain":"have done 强调经历与现在的联系；used to 表示过去习惯；since 说明起点。","goal":"能讨论学习、工作或生活方式的变化。","dialogue":[{"t":"Have you ever worked from home?","zh":"你有在家办公过吗？"},{"t":"Yes, I’ve done it for three years.","zh":"有，我已经这样做三年了。"},{"t":"Do you prefer it to the office?","zh":"比起去办公室，你更喜欢居家工作吗？"},{"t":"Mostly, yes. I used to commute for an hour every day.","zh":"大多时候是。我过去每天要通勤一小时。"}],"quiz":"How long has the speaker worked from home?","options":["One year","Two years","Three years"],"answer":2,"speaking":"解释过去和现在工作方式的不同，并说出优缺点。","writing":"写 90 词，说明你学习语言后出现了什么变化。","model":"I used to watch every film with subtitles. Recently, I’ve started listening before reading the text.","reading":"区分 have done 和过去时在真实对话中的使用情境。"},{"id":"en-3-1","lang":"en","level":3,"title":"表达不同意见","grammar":"I see your point / however / whereas","explain":"先确认对方观点，再温和提出不同看法。语气和语速对合作讨论很重要。","goal":"能礼貌反对并说出两条理由。","dialogue":[{"t":"I think remote work makes teams less creative.","zh":"我认为远程办公让团队缺乏创意。"},{"t":"I see your point, but I’ve had a different experience.","zh":"我理解，不过我的经历不太一样。"},{"t":"Really? What makes you say that?","zh":"是吗？为什么这么说？"},{"t":"We actually share ideas more often online, although some meetings are harder.","zh":"其实我们在线上分享想法更频繁，尽管有些会议更难开展。"}],"quiz":"What does the second speaker believe?","options":["Online sharing can be frequent","All meetings are easy","Remote work never works"],"answer":0,"speaking":"针对“应该每天学习两种语言吗”提出观点、让步和理由。","writing":"写一段包含让步和反驳的 100 词短评。","model":"While I understand the benefits of focusing on one language, switching tasks occasionally can keep me motivated.","reading":"不只听字面，观察 I see your point 的让步功能。"},{"id":"en-3-2","lang":"en","level":3,"title":"转述复杂问题","grammar":"reported speech / apparently / according to","explain":"区分自己亲见和别人告诉的信息；用 apparently 说明并非百分之百确定。","goal":"能把一段信息准确转述给第三人。","dialogue":[{"t":"Did the manager explain why the launch was delayed?","zh":"经理解释延期原因了吗？"},{"t":"She said the team needed more time to test the product.","zh":"她说团队需要更多时间测试产品。"},{"t":"Does that mean the deadline will change?","zh":"那意味着截止日期会变吗？"},{"t":"Apparently, yes, but they haven’t confirmed a new date.","zh":"看起来是，不过他们还没确认新日期。"}],"quiz":"Why was the launch delayed?","options":["The team needs more testing","The budget disappeared","The office closed"],"answer":0,"speaking":"向同事转述一项变更，明确哪些是已确认信息。","writing":"写一条含 said、apparently 和 confirmed 的工作消息。","model":"The team said they needed more time. Apparently, the deadline may change, but nothing has been confirmed yet.","reading":"抓取已证实信息和不确定信息，不要混为一谈。"},{"id":"en-3-3","lang":"en","level":3,"title":"访谈与长句主旨","grammar":"relative clauses / main idea / supporting detail","explain":"长句先找主句主谓，再识别例子、原因和限定信息。听完先概述主旨。","goal":"听懂 40 秒材料，区分主旨和细节。","dialogue":[{"t":"What surprised you most about the project?","zh":"这个项目最让你意外的是什么？"},{"t":"The number of people who volunteered, especially those with no prior experience.","zh":"志愿者人数，尤其是没有经验的那些人，让我惊讶。"},{"t":"Why do you think they joined?","zh":"你认为他们为什么参加？"},{"t":"Many said they wanted to feel connected to their neighborhood again.","zh":"许多人说他们想重新和所在社区建立联系。"}],"quiz":"Why did many people join?","options":["To earn money","To reconnect with the community","To get a certificate"],"answer":1,"speaking":"模拟采访，讲述一个改变你看法的经历。","writing":"写一段访谈摘要：主题句加两个支持细节。","model":"The interview suggests that people joined to reconnect with their community.","reading":"不要卡在 who volunteered 的从句上，先抓整体意思。"},{"id":"en-4-1","lang":"en","level":4,"title":"真实对话的省略与言外之意","grammar":"hedging / would rather / understatement","explain":"Could be worse 并不是在夸好；It’s not exactly... 常表示委婉否定。","goal":"听懂对方真实态度而不只理解字面。","dialogue":[{"t":"How did the presentation go?","zh":"演示进展得怎么样？"},{"t":"Well, it could’ve gone better.","zh":"嗯，本来可以更好一些。"},{"t":"Did the client reject the proposal?","zh":"客户拒绝方案了吗？"},{"t":"Not exactly. They liked the direction, but they want a major revision.","zh":"也不完全是。他们喜欢方向，但想要大幅修改。"}],"quiz":"What really happened?","options":["The proposal was accepted unchanged","The client wants major changes","The client never attended"],"answer":1,"speaking":"委婉解释一项工作进展不理想，但仍有希望。","writing":"写 100 词，使用 2 种委婉表达说明一次挫折。","model":"The reaction was mixed. It wasn’t exactly what we hoped for, but they’re open to another version.","reading":"注意 could’ve 的缩合与 not exactly 的真实语用。"},{"id":"en-4-2","lang":"en","level":4,"title":"处理俚语、转折与幽默","grammar":"idioms / tone / inference","explain":"That’s a stretch 表示“有点牵强”；人物开玩笑时语气可能和字面相反。","goal":"理解日常影视里的调侃与态度变化。","dialogue":[{"t":"You finished the entire report in an hour?","zh":"你一小时写完了整份报告？"},{"t":"More or less. I skipped lunch and drank way too much coffee.","zh":"差不多吧。我没吃午饭，还喝了太多咖啡。"},{"t":"Sounds like a healthy lifestyle.","zh":"听起来真是健康生活啊。"},{"t":"Yeah, I’m basically a role model.","zh":"没错，我简直就是模范人物。"}],"quiz":"What is the tone of the last two lines?","options":["Serious praise","Sarcasm and joking","Anger"],"answer":1,"speaking":"用英语讲一个轻微自嘲的经历，注意语气。","writing":"选择一段熟悉影视对白，记录两个不能直译的表达。","model":"I worked so late that my coffee probably deserves a salary.","reading":"识别反话：字面称赞与上下文负面事实相冲突。"},{"id":"en-4-3","lang":"en","level":4,"title":"辩论与权衡","grammar":"on the one hand / trade-off / nevertheless","explain":"进行高阶讨论要兼顾双方代价，而非只陈述“我喜欢”。","goal":"能就复杂问题展开利弊分析。","dialogue":[{"t":"Do you think AI will replace most routine tasks?","zh":"你觉得 AI 会取代多数重复性工作吗？"},{"t":"Probably, but that doesn’t mean every job will disappear.","zh":"可能，不过这不意味着每份工作都会消失。"},{"t":"What worries you the most?","zh":"你最担心什么？"},{"t":"The transition. People need time and support to adapt, even if the technology works well.","zh":"转型过程。即使技术有效，人们仍需要时间和支持来适应。"}],"quiz":"What is the main concern?","options":["Technology never works","The transition for people","All jobs remain unchanged"],"answer":1,"speaking":"就 AI 改变工作方式谈 90 秒：机会、风险、建议。","writing":"写 150 词观点文，至少使用三个逻辑连接词。","model":"The key issue is not simply what technology can do, but how people can adapt to it responsibly.","reading":"记录说话人的立场转折点：but / even if / the key issue。"},{"id":"en-5-1","lang":"en","level":5,"title":"解读潜台词与关系","grammar":"implicature / interpersonal pragmatics","explain":"“I’ll think about it” 有时是委婉拒绝，需结合停顿、语境与关系推断。","goal":"能分析人物表面用语与真实动机的差别。","dialogue":[{"t":"Would you consider joining us next year?","zh":"你愿意考虑明年加入我们吗？"},{"t":"It’s an interesting opportunity, though the timing is complicated.","zh":"机会很有吸引力，不过时机有些复杂。"},{"t":"So you haven’t ruled it out?","zh":"所以你还没有完全排除？"},{"t":"I wouldn’t say that. I just don’t want to make promises I can’t keep.","zh":"也不能这么说。我只是不想许下做不到的承诺。"}],"quiz":"What is the second speaker doing?","options":["Giving a firm yes","Avoiding a commitment","Demanding a higher salary"],"answer":1,"speaking":"扮演谈判者，表达兴趣但不作过早承诺。","writing":"写出人物对白的字面含义、潜在含义、证据各一句。","model":"The speaker is deliberately noncommittal, which may signal hesitation rather than enthusiasm.","reading":"寻找 hedging 信号：though、wouldn’t say、just。"},{"id":"en-5-2","lang":"en","level":5,"title":"识别叙事视角与不可靠叙述","grammar":"narrative framing / reliability","explain":"电影旁白未必可信。对比描述、事实与其他人物反应，判断叙述者偏差。","goal":"能用英语解释影视叙事中的人物偏见。","dialogue":[{"t":"He claims he had no choice, but the evidence suggests otherwise.","zh":"他声称自己别无选择，但证据表明并非如此。"},{"t":"Exactly. He keeps leaving out details that make him look bad.","zh":"正是。他总是省略那些对自己不利的细节。"},{"t":"Do you think he’s lying?","zh":"你认为他在说谎吗？"},{"t":"Maybe not outright. He might genuinely believe his own version of the story.","zh":"未必直接撒谎。他可能真的相信自己那套叙述。"}],"quiz":"Why might the character be unreliable?","options":["He is unable to speak","He selectively omits details","He is always correct"],"answer":1,"speaking":"复述一部电影中同一事件的两种可能解释。","writing":"写 150 词人物分析，区分事实和推测。","model":"The narrator may be sincere yet unreliable because he filters events through his own interests.","reading":"听不懂某个词也不影响辨识立场和推理关系。"},{"id":"en-5-3","lang":"en","level":5,"title":"无字幕电影的高级练习","grammar":"subtext / register / rapid speech","explain":"用“情节-关系-冲突-台词功能”四层分析；只在第一遍之后借助字幕核对。","goal":"能精听复杂片段，解释弦外之音并复述。","dialogue":[{"t":"You knew this was going to happen, didn’t you?","zh":"你早就知道会发生这种事，对吧？"},{"t":"I suspected it. That’s not the same as knowing.","zh":"我怀疑过，但怀疑和知道不是一回事。"},{"t":"And you decided not to tell me?","zh":"所以你决定不告诉我？"},{"t":"I decided not to panic you over something I couldn’t prove.","zh":"我不想拿一件无法证实的事让你恐慌。"}],"quiz":"What is the central conflict?","options":["A lost object","Whether someone should have shared a suspicion","A cancelled meeting"],"answer":1,"speaking":"分别从双方视角复述冲突，指出台词背后的动机。","writing":"写 180 词影评片段，分析人物动机与信息差。","model":"The dispute is less about the event itself than about trust, uncertainty, and responsibility.","reading":"训练先盲听、再核对、最后关闭字幕复述，避免依赖文字。"},{"id":"ja-0-1","lang":"ja","level":0,"title":"初次见面与自我介绍","grammar":"〜は〜です / 〜ですか","explain":"「は」写作 は 读 wa，用于提出主题。です 让表达礼貌。自我介绍常用「よろしくお願いします」。","goal":"能自然完成第一次见面的 4 轮对话。","dialogue":[{"t":"はじめまして。田中です。","zh":"初次见面，我是田中。"},{"t":"はじめまして。林です。よろしくお願いします。","zh":"初次见面，我是林，请多关照。"},{"t":"林さんは学生ですか。","zh":"林先生/女士是学生吗？"},{"t":"いいえ、デザイナーです。","zh":"不是，我是设计师。"}],"quiz":"林さんの仕事は何ですか。","options":["先生","デザイナー","学生"],"answer":1,"speaking":"礼貌介绍自己的工作与学习日语的目的。","writing":"用日语写三句自我介绍，尽量不用罗马字。","model":"はじめまして。林です。デザインの仕事をしています。よろしくお願いします。","reading":"先看假名跟读，注意语音拍节；随后遮住文字听。"},{"id":"ja-0-2","lang":"ja","level":0,"title":"时间与地点","grammar":"ここ / そこ / あそこ / 〜に","explain":"こ・そ・あ 表示靠近说话人、听话人和远处。に 可表示特定时间/存在位置。","goal":"能问时间和地点并核对信息。","dialogue":[{"t":"すみません。駅はどこですか。","zh":"请问车站在哪里？"},{"t":"あそこです。スーパーの隣です。","zh":"在那里，超市旁边。"},{"t":"ありがとうございます。今、何時ですか。","zh":"谢谢。现在几点？"},{"t":"三時半です。","zh":"三点半。"}],"quiz":"駅はどこにありますか。","options":["スーパーの隣","学校の中","病院の前"],"answer":0,"speaking":"询问车站在哪里、目前几点并复述回答。","writing":"用日语写一处地点的方位和一个约定时间。","model":"駅はスーパーの隣です。四時に会いましょう。","reading":"注意 さんじはん 的节拍和数字变化。"},{"id":"ja-0-3","lang":"ja","level":0,"title":"长音、促音和确认","grammar":"〜をください / もう一度 / ゆっくり","explain":"促音「っ」占一个拍，长音也占一拍。遇到不懂时主动请对方重复。","goal":"能在听不清时用日语修复沟通。","dialogue":[{"t":"すみません。コーヒーを一つください。","zh":"不好意思，请给我一杯咖啡。"},{"t":"ホットですか、アイスですか。","zh":"热的还是冰的？"},{"t":"すみません。もう一度、ゆっくりお願いします。","zh":"不好意思，请再慢点说一遍。"},{"t":"はい。ホットですか、アイスですか。","zh":"好的。热的还是冰的？"}],"quiz":"客は何をお願いしましたか。","options":["もっと速く","もう一度ゆっくり","水を二つ"],"answer":1,"speaking":"点咖啡，并请对方慢点重复问题。","writing":"写两句完整的礼貌请求。","model":"アイスコーヒーを一つください。もう一度お願いします。","reading":"留意「ホット」的促音和「コーヒー」的长音。"},{"id":"ja-1-1","lang":"ja","level":1,"title":"点餐与偏好","grammar":"〜が好きです / 〜をお願いします","explain":"が 标记喜好对象，を 表示动作宾语；点餐可说 〜をお願いします。","goal":"能在餐厅点餐、追加饮品并表达喜好。","dialogue":[{"t":"ご注文はお決まりですか。","zh":"您想好点什么了吗？"},{"t":"はい。カレーをお願いします。","zh":"想好了。我要咖喱。"},{"t":"お飲み物はいかがですか。","zh":"饮料要什么呢？"},{"t":"お茶をください。甘いものはあまり好きじゃないです。","zh":"请给我茶。我不太喜欢甜食。"}],"quiz":"何を飲みますか。","options":["水","お茶","コーヒー"],"answer":1,"speaking":"点一份主食和饮品，并表达一种不喜欢的口味。","writing":"写一段餐厅对话，包含至少两个助词。","model":"カレーを一つお願いします。お茶もください。","reading":"练习听懂敬语点餐常用句，先抓菜品再抓数量。"},{"id":"ja-1-2","lang":"ja","level":1,"title":"行程与交通","grammar":"〜に行きます / 〜で行きます","explain":"目的地用 に，交通工具用 で。练习「いつ・どこ・どうやって」。","goal":"能询问如何到达和出发时间。","dialogue":[{"t":"週末はどこに行きますか。","zh":"周末去哪里？"},{"t":"京都に行きます。","zh":"我去京都。"},{"t":"どうやって行きますか。","zh":"怎么去？"},{"t":"新幹線で行きます。朝八時に出ます。","zh":"坐新干线去，早上八点出发。"}],"quiz":"何で京都に行きますか。","options":["バス","新幹線","自転車"],"answer":1,"speaking":"介绍周末出行：目的地、交通方式、出发时间。","writing":"写一段 4 句日语行程安排。","model":"土曜日に京都に行きます。新幹線で行きます。朝八時に出ます。","reading":"「に」和「で」在连续句子里扮演不同角色。"},{"id":"ja-1-3","lang":"ja","level":1,"title":"请求与允许","grammar":"〜てください / 〜てもいいですか","explain":"动词て形连接请求与许可。先熟练高频动词的て形，再扩大场景。","goal":"能提出请求、询问是否允许做某事。","dialogue":[{"t":"すみません。ここで写真を撮ってもいいですか。","zh":"不好意思，这里可以拍照吗？"},{"t":"申し訳ありません。ここは撮影禁止です。","zh":"很抱歉，这里禁止拍照。"},{"t":"そうですか。どこなら大丈夫ですか。","zh":"这样啊，哪里可以呢？"},{"t":"外の庭でお願いします。","zh":"请在外面的庭院拍。"}],"quiz":"どこで写真を撮れますか。","options":["この部屋","外の庭","エレベーター"],"answer":1,"speaking":"在博物馆请求拍照，听懂拒绝后继续追问。","writing":"写两个「〜てもいいですか」问句。","model":"ここに座ってもいいですか。少し待ってもいいですか。","reading":"辨识「申し訳ありません」为礼貌拒绝标记。"},{"id":"ja-2-1","lang":"ja","level":2,"title":"过去经历和感受","grammar":"〜たことがあります / 〜と思いました","explain":"用「たことがある」表示经历，用「と思う」表达感受/判断。","goal":"能连续介绍一次经历和感想。","dialogue":[{"t":"北海道に行ったことがありますか。","zh":"你去过北海道吗？"},{"t":"はい、去年の冬に行きました。","zh":"去过，去年冬天去了。"},{"t":"どうでしたか。","zh":"怎么样？"},{"t":"雪がとてもきれいで、また行きたいと思いました。","zh":"雪很漂亮，我想再去一次。"}],"quiz":"いつ北海道に行きましたか。","options":["去年の冬","今年の夏","来週"],"answer":0,"speaking":"描述过去旅行的时间、经历和感受。","writing":"用日语写 5 句经历描述，包含 たことがある。","model":"京都に行ったことがあります。町が静かで、とても気に入りました。","reading":"注意「きれいで」连接后半句，听懂评价变化。"},{"id":"ja-2-2","lang":"ja","level":2,"title":"讨论选择的原因","grammar":"〜から / 〜ほうが / 〜と思います","explain":"用から说原因、ほうが 比较两项；不要只给出结论。","goal":"能讨论选择、说明理由并作决定。","dialogue":[{"t":"どちらのホテルがいいと思いますか。","zh":"你觉得哪家酒店更好？"},{"t":"駅に近いホテルのほうが便利だと思います。","zh":"我觉得车站附近那家更方便。"},{"t":"でも、少し高いですよね。","zh":"但是稍微贵一些吧。"},{"t":"そうですね。でも、移動が楽ですから、そちらにしましょう。","zh":"是啊。不过因为出行方便，就选那家吧。"}],"quiz":"近いホテルを選んだ理由は何ですか。","options":["移動が楽だから","部屋が広いから","朝食が無料だから"],"answer":0,"speaking":"比较两家住宿并给出至少两个理由。","writing":"用「と思います」「から」写一段自己的选择。","model":"駅に近いほうがいいと思います。毎朝出かけますから。","reading":"「でも」之后出现反对信息，「ですから」之后出现决定。"},{"id":"ja-2-3","lang":"ja","level":2,"title":"邀请、打算与婉拒","grammar":"〜つもり / 〜ませんか / ちょっと","explain":"「ちょっと…」加停顿常构成委婉拒绝，并非只表示“一点”。理解日本式语用。","goal":"能发出邀请，听懂委婉拒绝并回应。","dialogue":[{"t":"今週の土曜日、一緒に映画を見ませんか。","zh":"这周六一起看电影吗？"},{"t":"ありがとうございます。でも、土曜日はちょっと…。","zh":"谢谢，不过周六有点……"},{"t":"そうですか。日曜日はどうですか。","zh":"这样啊，周日怎么样？"},{"t":"日曜日なら大丈夫です。楽しみにしています。","zh":"周日可以。我很期待。"}],"quiz":"土曜日の返事はどんな意味ですか。","options":["行ける","行けない可能性が高い","必ず遅れる"],"answer":1,"speaking":"邀请朋友观影，并在对方婉拒后提出替代日期。","writing":"写一段婉拒邀请并提出其他建议的日语。","model":"土曜日はちょっと予定があります。日曜日なら大丈夫です。","reading":"注意停顿和省略表达，不能只翻译「ちょっと」。"},{"id":"ja-3-1","lang":"ja","level":3,"title":"意见交换与部分同意","grammar":"〜一方で / 〜と思う / たしかに","explain":"日语讨论常先同意一部分，再说明自己的保留意见。","goal":"能用 6 句左右进行有逻辑的意见交换。","dialogue":[{"t":"在宅勤務は効率がいいと思いますか。","zh":"你觉得居家办公效率高吗？"},{"t":"たしかに通勤時間は減りますね。","zh":"确实，通勤时间减少了。"},{"t":"でも、相談しにくいこともありますよね。","zh":"不过也有不方便讨论事情的时候。"},{"t":"そうですね。一方で、集中しやすいという利点もあります。","zh":"是啊。另一方面，也有更容易集中注意力的好处。"}],"quiz":"在宅勤務の利点は何ですか。","options":["集中しやすい","相談しやすい","通勤が長くなる"],"answer":0,"speaking":"对“远程工作是否好”提出观点、优点和限制。","writing":"用「たしかに」「一方で」写 5 句短评。","model":"たしかに便利です。一方で、対面で話す機会が少なくなります。","reading":"听连接词判断说话人是否转变立场。"},{"id":"ja-3-2","lang":"ja","level":3,"title":"转述新闻与不确定性","grammar":"〜そうです / 〜らしい / 〜によると","explain":"「そうです」有转闻用法，「らしい」表示依据所闻的推测；注意证据强度。","goal":"能准确转述自己听到的消息。","dialogue":[{"t":"来月、新しい店ができるらしいですね。","zh":"听说下个月要开新店啊。"},{"t":"そうですね。新聞によると、駅の近くだそうです。","zh":"是啊。据报纸说，就在车站附近。"},{"t":"もうオープンの日は決まったんですか。","zh":"开业日期已经定了吗？"},{"t":"そこまでは、まだ分からないみたいです。","zh":"那方面好像还不知道。"}],"quiz":"新しい店はどこにできる予定ですか。","options":["駅の近く","大学の中","公園の横"],"answer":0,"speaking":"转述新店的消息并指出尚未确定的细节。","writing":"写一段 5 句新闻摘要，区分已知与未知。","model":"ニュースによると、来月オープンするそうです。詳しい日はまだ分かりません。","reading":"区分转闻、推测与确证，避免过度肯定。"},{"id":"ja-3-3","lang":"ja","level":3,"title":"请求协调与敬语","grammar":"〜ていただけますか / 恐れ入りますが","explain":"在职场用 いただけますか 表达委婉请求；注意主语省略和动作对象。","goal":"能在较正式场合解释问题并请求帮助。","dialogue":[{"t":"恐れ入りますが、この資料を確認していただけますか。","zh":"不好意思，能请您确认这份资料吗？"},{"t":"はい。いつまでに必要ですか。","zh":"好的，什么时候需要？"},{"t":"できれば、明日の午前中までにお願いします。","zh":"如果可以，请在明天上午之前。"},{"t":"承知しました。確認しておきます。","zh":"明白，我会提前确认好。"}],"quiz":"資料はいつまでに必要ですか。","options":["今日の夜","明日の午前中","来週"],"answer":1,"speaking":"请同事审阅材料，说明截止时间并表达感谢。","writing":"写一条商务日语请求，包含期限与礼貌表达。","model":"恐れ入りますが、金曜日までにご確認いただけますと幸いです。","reading":"注意「承知しました」对应正式语境里的“明白了”。"},{"id":"ja-4-1","lang":"ja","level":4,"title":"言外之意与社交距离","grammar":"別に / まあ / 微妙 / ちょっと","explain":"「微妙」常含保留甚至负面评价；「別に」的态度因语气不同而变化。","goal":"能识别人物真实评价与社交距离。","dialogue":[{"t":"昨日の映画、どうだった。","zh":"昨天的电影怎么样？"},{"t":"うーん、まあ、悪くはなかったかな。","zh":"嗯，算不上差吧。"},{"t":"そんなに面白くなかったってこと？","zh":"就是说没那么好看？"},{"t":"ストーリーはよかったけど、最後がちょっと微妙だった。","zh":"故事还不错，但结尾有点不太行。"}],"quiz":"話し手は映画の結末をどう評価していますか。","options":["とても高く","少し否定的に","全く触れていない"],"answer":1,"speaking":"委婉评价一部不太喜欢的作品，保留对优点的承认。","writing":"找一句含混评价，分别写字面意思与真实态度。","model":"全体としてはよかったけど、結末はちょっと期待外れでした。","reading":"影视里关注 まあ、かな、微妙 等缓和与保留表达。"},{"id":"ja-4-2","lang":"ja","level":4,"title":"对立观点与让步","grammar":"とはいえ / わけではない / 反面","explain":"让步后表达限定，观察哪部分是主要立场。","goal":"能从长对话中总结对立观点。","dialogue":[{"t":"便利なら、何でも自動化したほうがいいんでしょうか。","zh":"只要方便，就该把所有东西自动化吗？"},{"t":"いや、必ずしもそういうわけではないと思います。","zh":"不，我觉得也不一定。"},{"t":"たとえば、どんな問題がありますか。","zh":"比如会有什么问题？"},{"t":"効率は上がる反面、人が判断する機会が減るかもしれません。","zh":"效率会提高，但人们作出判断的机会可能减少。"}],"quiz":"話し手の懸念は何ですか。","options":["判断する機会が減る","すべてが遅くなる","自動化が不可能"],"answer":0,"speaking":"讨论自动化的一个好处、一个风险和个人立场。","writing":"用「反面」「わけではない」写一段短评。","model":"便利だからといって、すべてを自動化すべきだというわけではありません。","reading":"听取“限定”线索，不要把部分否定听成全面否定。"},{"id":"ja-4-3","lang":"ja","level":4,"title":"快语速中的省略","grammar":"〜んじゃない / 〜ちゃう / って","explain":"日常对白常把「てしまう」缩成「ちゃう」，用「って」转述。","goal":"能在自然语速中辨认省略与缩约。","dialogue":[{"t":"え、もう帰っちゃうの。","zh":"诶，你这就回去啦？"},{"t":"うん、明日早いんだ。","zh":"嗯，明天得早起。"},{"t":"さっき、もう少しいるって言ってなかった。","zh":"你刚才不是说还要待一会儿吗？"},{"t":"そうなんだけど、急に予定が入っちゃって。","zh":"本来是，但突然有安排了。"}],"quiz":"帰る理由は何ですか。","options":["明日早くて急用もできた","映画が終わった","電車が止まった"],"answer":0,"speaking":"用自然口语解释临时改变计划的原因。","writing":"写出两组口语缩约与正式写法的对应关系。","model":"帰っちゃう → 帰ってしまう／予定が入っちゃって → 予定が入ってしまって。","reading":"反复听 ちゃう、って 等缩约，注意形态与语气。"},{"id":"ja-5-1","lang":"ja","level":5,"title":"隐含冲突与人物动机","grammar":"婉曲的质问 / 言外の意味","explain":"「そういうことだったんだ」可能表达理解，也可能包含责备；要结合前后语境。","goal":"能解释剧情冲突中的信任与责任问题。","dialogue":[{"t":"最初から知ってたんじゃないの。","zh":"你是不是一开始就知道？"},{"t":"確信があったわけじゃない。","zh":"我也没有十足把握。"},{"t":"だからって、黙ってていい理由にはならないでしょ。","zh":"就算这样，也不能成为保持沉默的理由吧？"},{"t":"心配させたくなかったんだよ。","zh":"我只是不想让你担心。"}],"quiz":"二人の争点は何ですか。","options":["お金の使い方","情報を伝えなかったこと","旅行の日程"],"answer":1,"speaking":"分别扮演双方，解释隐瞒信息与保护他人的矛盾。","writing":"写一段 8 句日语短评，分析人物双方动机。","model":"一方は相手を守ろうとしたが、もう一方は信頼を裏切られたと感じている。","reading":"注意「だからって」表示反驳而非单纯因果。"},{"id":"ja-5-2","lang":"ja","level":5,"title":"新闻访谈与立场","grammar":"もっとも / 必ずしも / にもかかわらず","explain":"高阶日语的争点常在让步、限定与证据关系中展开。","goal":"听懂访谈的条件、判断及保留意见。","dialogue":[{"t":"新しい制度は、現場でどう受け止められていますか。","zh":"新制度在一线是如何被接受的？"},{"t":"期待は大きいものの、準備が追いついていないという声もあります。","zh":"期待很高，不过也有人说准备跟不上。"},{"t":"導入は延期すべきだとお考えですか。","zh":"您认为应该推迟实施吗？"},{"t":"必ずしもそうではありません。ただ、十分な支援は欠かせないと思います。","zh":"也不一定。只是我认为充分支持不可或缺。"}],"quiz":"話し手の立場はどれですか。","options":["全面的な反対","条件付きの支持","無条件の賛成"],"answer":1,"speaking":"就一项公共政策作条件性评价，避免极端判断。","writing":"写一段包含让步与结论的 150 字日语摘要。","model":"制度の意義は認められるものの、導入には現場への支援が欠かせない。","reading":"先找“支持还是反对”，再听附带条件。"},{"id":"ja-5-3","lang":"ja","level":5,"title":"无字幕日剧的深度精听","grammar":"角色语言 / 语域切换 / 省略","explain":"同一句话在不同身份与关系中含义不同；每段素材练盲听、听写、复述、分析。","goal":"能用日语复述冲突并解释角色立场。","dialogue":[{"t":"あのとき、何も言わなかったよね。","zh":"那时候你什么也没说，对吧。"},{"t":"言ったところで、信じてもらえなかったと思う。","zh":"就算说了，我想你也不会相信。"},{"t":"それを決めるのは、あなたじゃないでしょ。","zh":"有没有可能相信，不该由你来决定吧。"},{"t":"……そうだね。そこは間違ってた。","zh":"……你说得对。这一点是我错了。"}],"quiz":"最後の発言は何を示していますか。","options":["責任の一部を認めた","会話を拒否した","相手を責め続けた"],"answer":0,"speaking":"不用中文，复述场景人物关系、冲突、转折与结局。","writing":"写 180 字日语场景评论，辨析双方潜台词。","model":"相手の判断を勝手に決めたことへの反省が、最後の発言に表れている。","reading":"先关字幕听，再看字幕确认，最后关闭字幕复述。"}],"extensions":{"en":[["A0","语音专项","英语元音、辅音、音节重音；听最小对立组并模仿"],["A1","交际专项","电话、天气、价格、颜色、看病与简单投诉"],["A2","理解专项","广播通知、短视频说明、人物经历和生活纪录片"],["B1","表达专项","项目说明、问题解决、求职面试与故事复述"],["B2","影视专项","快语速、人物间接评价、播客与口音辨识"],["C1+","高阶专项","辩论、社会议题、电影潜台词、冷幽默和复杂叙事"]],"ja":[["入门","文字专项","五十音、浊音、拗音、长音、促音；每日跟读听辨"],["N5/A1","汉字专项","高频生活汉字与读音，在句子里识别而不孤立死背"],["N4/A2","表达专项","授受表达、普通形、可能形、生活经历、邀请婉拒"],["N3/B1","互动专项","解释理由、拜托、道歉、会话修复、初级敬语"],["N2/B2","影视专项","省略、终助词、自然语速与省略主语的补全"],["N1+/C1","高阶专项","日剧潜台词、角色语言、方言听辨和正式访谈"]]}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('curriculum').textContent);
const KEY='xiangsheng_dual_language_studio_v1';
const defaultState=()=>({lang:'en',view:'dashboard',level:{en:0,ja:0},activeLesson:'en-0-1',lessonTab:'guide',dailyMinutes:90,englishRatio:50,playback:0.92,progress:{},cards:{},outputs:{},logs:[],quiz:{},dictation:{},spoken:{},goals:{},kana:{},journal:{},filmTasks:{},subVisible:false});
let state=defaultState();try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s && typeof s==='object'){state={...state,...s,level:{...state.level,...s.level}}}}catch(e){}
const root=document.getElementById('root');let movieUrl='',movieName='',cues=[],loopA=null,loopB=null,loopOn=false,selectedCue=-1,filmFile='',mediaRecorder=null,recordChunks=[],recordUrl='',voices=[];let soundBusy=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('本地存储受限，请导出备份。')}}
const $=(sel)=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateId=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const futureDate=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateId(d)};

function normalize(s,lang){s=(s||'').toLowerCase().normalize('NFKC').trim().replace(/[\s、。？！.,!?「」『』：:；;’'"“”\-]/g,'');return s}
function sim(a,b){let m=a.length,n=b.length;if(!m&&!n)return 1;if(!m||!n)return 0;let row=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let next=[i];for(let j=1;j<=n;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));row=next}return Math.max(0,1-row[n]/Math.max(m,n))}

function settings(){shell(`${header('PERSONAL SETTINGS','安排你的双语学习节奏','支持不同基础直接选择阶段，设置每日分配，并把进度导出成文件。无需注册；部署后的课程可离线打开。')}<div class="grid-2"><div class="card"><h3>每日学习计划</h3><label class="label">两种语言每天合计分钟数</label><select id="minutes" class="select">${[30,45,60,90,120,150,180,240].map(x=>`<option value="${x}" ${state.dailyMinutes===x?'selected':''}>${x} 分钟${x===90?' · 推荐起点':''}</option>`).join('')}</select><label class="label">英语所占比例：<b id="ratioLabel">${state.englishRatio}%</b>（其余给日语）</label><input id="ratio" type="range" min="20" max="80" step="5" style="width:100%;accent-color:#187b76" value="${state.englishRatio}"><div class="row small muted"><span>英语多一些</span><span>日语多一些</span></div><label class="label">语音朗读速度</label><select id="rate" class="select">${[[.7,'0.70 · 慢速辨音'],[.85,'0.85 · 精听'],[.92,'0.92 · 自然过渡'],[1,'1.00 · 标准'],[1.15,'1.15 · 快语速']].map(x=>`<option value="${x[0]}" ${state.playback===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="btn sp-top" data-save-settings="1">保存学习计划</button></div><div class="card"><h3>我的起点</h3>${['en','ja'].map(l=>`<label class="label">${langName(l)} · 当前准备开始的阶段</label><select id="level_${l}" class="select">${DATA.levels[l].map((lv,i)=>`<option value="${i}" ${state.level[l]===i?'selected':''}>${esc(lv.code)} · ${esc(lv.label)}</option>`).join('')}</select>`).join('')}<p class="small muted">暂不清楚自己的水平？从能够听懂但说得不流畅的较低阶段开始，先做听写和自主表达，再逐级调整。</p><button class="btn secondary" data-save-settings="1">应用当前起点</button></div><div class="card"><h3>iPhone 数据与备份</h3><p class="small muted">Safari 与桌面图标打开的 App 可能分别保存学习记录；首次安装后如无原有进度，请先导出旧记录，再进入桌面 App 导入。</p><p class="small muted">所有课程进度、自评、写作、学习分钟数储存在当前浏览器的本地存储中。浏览器清除数据后可能丢失，建议每周导出备份。</p><div class="btn-row"><button class="btn" data-export="1">↓ 保存 JSON 备份</button><button class="btn secondary" data-share-backup="1">⇪ 分享到「文件」</button><label class="btn secondary" style="cursor:pointer">↑ 导入备份<input type="file" id="importFile" accept="application/json,.json" class="hide"/></label></div><p class="tiny muted">视频、音频和字幕文件不会写入学习备份，需自己保留原文件。</p></div><div class="card"><h3>技术说明</h3><p class="small muted">① 在手机浏览器中打开 HTML 可使用课程、听写、打卡、影视本地播放器。若部署到 HTTPS 静态网站，可安装为桌面应用并支持离线访问。② 朗读使用系统浏览器 TTS，是否有自然发音取决于系统语音包。③ 语音识别功能仅在兼容浏览器中提供，可能调用浏览器在线服务。④ 本版本不包含真正的 AI 对话纠错或自动口音评分。</p><p class="small muted">想获得高级口语能力，建议另外安排每周至少两次真实双向对话（老师、语伴或可反馈的口语服务）。</p></div></div>`)}
function cinema(){let l=state.lang;let sessions=state.filmTasks?.[l]||[];let preset=`<div class="card"><h3>影视精听的五步循环</h3>${[['01','盲听一遍','关字幕，先判断人物、关系和事件。'],['02','局部精听','选 5–20 秒片段，0.75–1 倍循环播放。'],['03','听写并核对','完整写出句子，查看字幕修正漏听、连读和未知结构。'],['04','影子跟读','跟着人物的语气、停顿、节奏反复模仿。'],['05','脱稿复述','用目标语言描述发生了什么，以及人物为什么这样说。']].map(([n,k,v])=>`<div class="row" style="align-items:flex-start;margin:12px 0"><span class="pill teal">${n}</span><div style="flex:1"><b>${k}</b><div class="small muted">${v}</div></div></div>`).join('')}</div>`;
shell(`${header('REAL WORLD LISTENING','影视精听实验室','最终目标是观看真实电影时不依赖字幕。选择你自己合法获取的视频与匹配字幕，按片段练习，电影文件始终只在本机播放。')}<div class="grid-2"><div class="card"><h3>导入本地素材</h3><label class="label">电影 / 剧集 / 访谈 / 录音（MP4、WEBM、MP3 等浏览器支持的格式）</label><input type="file" id="movieFile" class="input" accept="video/*,audio/*"><label class="label">可选字幕 SRT / VTT（推荐第一次不看）</label><input type="file" id="subtitleFile" class="input" accept=".srt,.vtt,text/plain"><p class="tiny muted">不上传服务器。请使用自己的合法素材，字幕请与视频版本和语言匹配。部分视频编码可能不被浏览器支持。</p><div class="btn-row sp-top"><button class="btn secondary small" data-film-sub="1">${state.subVisible?'隐藏字幕':'显示字幕'}</button><label class="small">速度 <select id="filmRate" class="select" style="width:auto;padding:5px 7px"><option value=".75">0.75×</option><option value=".85">0.85×</option><option value="1" selected>1.0×</option><option value="1.15">1.15×</option></select></label></div></div>${preset}</div><div class="grid-2 sp-top" style="grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr)"><div class="card"><h3>片段播放器 <small class="muted" id="filmName">${esc(movieName||'尚未导入')}</small></h3><div class="film-wrap"><video id="filmVideo" controls playsinline preload="metadata" ${movieUrl?`src="${esc(movieUrl)}"`:''}></video><div id="filmSubtitle" class="film-sub"></div></div><div class="btn-row sp-top"><button class="btn secondary small" data-set-a="1">A · 起点</button><button class="btn secondary small" data-set-b="1">B · 终点</button><button class="btn small ${loopOn?'orange':'outline'}" data-loop="1">${loopOn?'■ 关闭循环':'↻ A-B 循环'}</button><button class="btn small outline" data-clear-loop="1">清除范围</button></div><div class="small muted" id="loopInfo" style="margin-top:9px">${loopA!==null?'A '+fmtTime(loopA):'尚未设置 A'}　${loopB!==null?'B '+fmtTime(loopB):''}</div><div class="rule"></div><h4>素材逐句听写</h4><p class="small muted" id="cueInfo">${cues.length?'已载入 '+cues.length+' 句字幕。点击右侧字幕可定位，也可跟随播放进度选择。':'导入字幕后可选择一句完整台词来听写。没有字幕也可以手动精听、复述。'}</p><textarea class="textarea" id="filmDict" placeholder="先藏字幕听一句，把听到的原话写下来。"></textarea><div class="btn-row"><button class="btn small" data-check-film="1">核对当前字幕</button><button class="btn secondary small" data-add-film="1">保存本段精听</button></div><div id="filmFeedback"></div><label class="label">本次训练分钟数</label><div class="btn-row"><input id="filmMinutes" class="input" type="number" min="1" max="360" value="20" style="max-width:110px"><button class="btn outline small" data-log-film="1">记入${langName(l)}学习日志</button></div></div><div class="card"><h3>字幕轨道 <span id="cueCount" class="pill">${cues.length} 句</span></h3><div id="cueList" class="subtitle-list">${cues.length?renderCueList():'<div class="muted-box small muted">选择字幕文件后，这里会出现可点击的台词列表。你可以先完全不看字幕完成第一遍。</div>'}</div><h4 style="margin-top:17px">已保存片段</h4><div style="max-height:180px;overflow:auto">${sessions.length?sessions.slice(-10).reverse().map(x=>`<div class="small" style="padding:8px;border-bottom:1px solid var(--line)"><b>${esc(x.file)}</b><div class="muted">${esc(x.time)} · ${esc(x.date)}</div></div>`).join(''):'<p class="small muted">精听后保存你反复练过的片段。</p>'}</div></div></div><div class="split-note"><b>什么时候开始用电影？</b><div class="small muted">A0–A2：每次选极短、清晰的台词，先把发音、语法、句义练稳。B1：扩展到连续场景。B2：加强自然语速、俚语和省略。C1+：无字幕观看较长剧情并分析潜台词。逐渐减少字幕，而不是第一天就硬啃整部影片。</div></div>`);let video=$('#filmVideo');if(video){video.addEventListener('timeupdate',updateFilmTime);video.addEventListener('loadedmetadata',updateFilmTime);if(movieUrl)video.src=movieUrl}}
function parseTimecode(str){let s=str.trim().replace(',','.').split(':').map(Number);if(s.some(x=>!Number.isFinite(x)))return NaN;return s.length===3?s[0]*3600+s[1]*60+s[2]:s.length===2?s[0]*60+s[1]:NaN}
function parseSubs(text){let blocks=text.replace(/^\uFEFF/,'').replace(/\r/g,'').split(/\n\s*\n/),result=[];for(let b of blocks){let lines=b.trim().split('\n'),idx=lines.findIndex(x=>x.includes('-->'));if(idx<0)continue;let range=lines[idx].split('-->');if(range.length!==2)continue;let start=parseTimecode(range[0]),end=parseTimecode(range[1].trim().split(/\s+/)[0]);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)continue;let t=lines.slice(idx+1).join('\n').replace(/<[^>]+>/g,'').trim();if(t)result.push({start,end,t})}return result.sort((a,b)=>a.start-b.start).slice(0,7000)}
function fmtTime(t){if(t===null||!Number.isFinite(t))return '—';let n=Math.floor(t);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function renderCueList(){let sub=cues.slice(0,1200);return sub.map((c,i)=>`<div class="cue ${i===selectedCue?'current':''}" data-seek-cue="${i}"><span class="cue-time">${fmtTime(c.start)}</span><span class="small">${esc(c.t)}</span></div>`).join('')+(cues.length>1200?'<p class="muted small">字幕较长，仅显示前 1200 句，可随视频播放同步当前片段。</p>':'')}
function updateFilmTime(){let v=$('#filmVideo');if(!v)return;let t=v.currentTime;if(loopOn&&loopA!==null&&loopB!==null&&loopB>loopA&&t>=loopB){v.currentTime=loopA;v.play().catch(()=>{});t=loopA}let i=cues.findIndex(c=>t>=c.start&&t<c.end);if(i!==selectedCue){selectedCue=i;let elem=$('#filmSubtitle');if(elem)elem.textContent=state.subVisible&&i>=0?cues[i].t:'';let cueInfo=$('#cueInfo');if(cueInfo&&i>=0)cueInfo.textContent='当前：'+fmtTime(cues[i].start)+' · '+(state.subVisible?cues[i].t:'字幕已隐藏，请盲听');let list=$('#cueList');if(list){list.querySelector('.cue.current')?.classList.remove('current');let cur=list.querySelector(`[data-seek-cue="${i}"]`);if(cur)cur.classList.add('current')}}}
function speak(text,lang=state.lang,done){if(!('speechSynthesis' in window)){toast('浏览器不支持语音朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='ja'?'ja-JP':'en-US';u.rate=state.playback;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith(lang==='ja'?'ja':'en')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith(lang==='ja'?'ja':'en'));if(v)u.voice=v;u.onend=()=>done?.();u.onerror=()=>{toast('系统未能朗读，请检查语言语音包。')};speechSynthesis.speak(u)}
function speakDialogue(xs,index=0){if(index>=xs.length)return;speak(xs[index].t, state.lang,()=>{setTimeout(()=>speakDialogue(xs,index+1),280)})}
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){toast('当前 iPhone 浏览器或环境不支持录音，请使用 HTTPS 网址并检查 Safari 版本');return}
 try{
  if(mediaRecorder?.state==='recording'){toast('正在录音中');return}
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(recordUrl){URL.revokeObjectURL(recordUrl);recordUrl=''}
  recordChunks=[];
   let options={};
   if(MediaRecorder.isTypeSupported?.('audio/mp4'))options.mimeType='audio/mp4';
   else if(MediaRecorder.isTypeSupported?.('audio/webm;codecs=opus'))options.mimeType='audio/webm;codecs=opus';
   try{mediaRecorder=new MediaRecorder(stream,options)}catch(e){mediaRecorder=new MediaRecorder(stream)}
  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordChunks.push(e.data)};
  mediaRecorder.onstop=()=>{let blob=new Blob(recordChunks,{type:mediaRecorder.mimeType||'audio/webm'});recordUrl=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());let n=$('#recordStatus');if(n)n.textContent='录音完成，可回听，也可保存音频文件。';toast('录音完成')};
  mediaRecorder.start();let n=$('#recordStatus');if(n)n.textContent='正在录音，完成后点击「停止」。';toast('正在录音…')
 }catch(e){toast('麦克风录音不可用，请检查权限及 HTTPS 安全环境')}
}
function stopRecording(){if(mediaRecorder?.state==='recording')mediaRecorder.stop();else toast('请先开始录音')}
function playRecording(){if(!recordUrl){toast('请先录制一段回答');return}new Audio(recordUrl).play().catch(()=>toast('音频播放未成功，请再点击一次'))}
function downloadRecording(){if(!recordUrl){toast('请先录制音频');return}let mime=mediaRecorder?.mimeType||'audio/webm',ext=mime.includes('mp4')?'mp4':mime.includes('ogg')?'ogg':'webm';let a=document.createElement('a');a.href=recordUrl;a.download='双语口语练习_'+dateId()+'.'+ext;document.body.appendChild(a);a.click();a.remove()}
function recognize(){let Impl=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Impl){toast('当前浏览器不支持语音识别，请手动输入回答。');return}let rec=new Impl();rec.lang=state.lang==='ja'?'ja-JP':'en-US';rec.continuous=false;rec.interimResults=false;rec.onresult=e=>{let out=$('#speechInput');if(out)out.value=(out.value?out.value+'\n':'')+e.results[0][0].transcript;toast('转写已填入，可以修正后保存')};rec.onerror=e=>toast('识别不可用：'+e.error+'。可使用 iPhone 键盘麦克风或手动输入。');try{rec.start();toast('正在识别，请说话…（部分浏览器需要联网）')}catch(e){toast('无法开始识别，请手动输入。')}}
function backupFile(){let exportedAt=new Date().toISOString();const copy={...state,lastBackupAt:exportedAt};let content=JSON.stringify({product:'bilingual_studio',version:1,exportedAt,state:copy},null,2);return {file:new File([content],'双语学习进度备份_'+dateId()+'.json',{type:'application/json'}),date:exportedAt}}

function attachHandlers(){root.onclick=(ev)=>{let el=ev.target.closest('button,[data-seek-cue]');if(!el)return;
if(el.dataset.mobileMenuToggle){let d=root.querySelector('.mobile-menu-backdrop');d.classList.toggle('opened');document.body.style.overflow=d.classList.contains('opened')?'hidden':'';return}
if(el.dataset.nav){document.body.style.overflow='';state.view=el.dataset.nav;save();render();window.scrollTo(0,0);return}
if(el.dataset.lang){state.lang=el.dataset.lang;save();render();window.scrollTo(0,0);return}
if(el.dataset.langAndLesson){let l=el.dataset.langAndLesson;openLesson(nextLesson(l).id);return}
if(el.dataset.openLesson){openLesson(el.dataset.openLesson);return}
if(el.dataset.tab){state.lessonTab=el.dataset.tab;save();render();return}
if(el.dataset.setLevel!==undefined){state.level[state.lang]=Number(el.dataset.setLevel);save();render();toast('当前阶段已更新');return}
if(el.dataset.quickLog){logMin('course',state.lang,Number(el.dataset.quickLog));return}
const x=lessonById(state.activeLesson);
if(el.dataset.speak!==undefined){speak(x.dialogue[Number(el.dataset.speak)].t,x.lang);return}
if(el.dataset.speakAll){speakDialogue(x.dialogue);return}
if(el.dataset.toggleText){window.showTranscript=!window.showTranscript;root.querySelectorAll('.utterance .original').forEach(n=>n.classList.toggle('hide',!window.showTranscript));el.textContent=(window.showTranscript?'隐藏':'显示')+'原文';return}
if(el.dataset.toggleTrans){window.showTranslation=!window.showTranslation;root.querySelectorAll('.utterance .translation').forEach(n=>n.classList.toggle('hide',!window.showTranslation));el.textContent=(window.showTranslation?'隐藏':'显示')+'中文';return}
if(el.dataset.answer!==undefined){state.quiz[x.id]=Number(el.dataset.answer);save();render();return}
if(el.dataset.nextDict){let idx=(state.dictation[x.id]?.index??1);state.dictation[x.id]={index:(idx+1)%x.dialogue.length};save();render();return}
if(el.dataset.checkDict){let idx=state.dictation[x.id]?.index??1,draft=$('#dictInput')?.value||'',reference=x.dialogue[idx].t;let score=sim(normalize(draft,x.lang),normalize(reference,x.lang));state.dictation[x.id]={index:idx,draft,result:score};save();render();return}
if(el.dataset.shadow!==undefined){let i=Number(el.dataset.shadow);state.spoken[x.id]??={};state.spoken[x.id][i]=Math.min(3,(state.spoken[x.id][i]||0)+1);save();render();return}
if(el.dataset.recordStart){startRecording();return}
if(el.dataset.recordStop){stopRecording();return}
if(el.dataset.recordPlay){playRecording();return}
if(el.dataset.recordDownload){downloadRecording();return}
if(el.dataset.recognize){recognize();return}
if(el.dataset.saveSpeech){state.outputs[x.id]??={};state.outputs[x.id].speech=$('#speechInput')?.value.trim()||'';save();toast('口语表达已保存');return}
if(el.dataset.saveWriting){state.outputs[x.id]??={};state.outputs[x.id].writing=$('#writingInput')?.value.trim()||'';save();toast('自主表达已保存');return}
if(el.dataset.showModel){$('#modelAnswer')?.classList.toggle('hide');return}
if(el.dataset.finish){state.progress[x.id]={completed:true,date:dateId()};save();toast('本课训练完成。请在学习记录中登记实际时长。');render();return}
if(el.dataset.nextLesson){let ls=lessons(x.lang),j=ls.findIndex(v=>v.id===x.id);openLesson(ls[(j+1)%ls.length].id);return}
if(el.dataset.kanaMode){kanaMode=el.dataset.kanaMode;kana();return}
if(el.dataset.kanaSpeak!==undefined){let k=KANA[Number(el.dataset.kanaSpeak)];speak(k[kanaMode],'ja');return}
if(el.dataset.kanaPlay){speak(KANA[kanaIndex][kanaMode],'ja');return}
if(el.dataset.kanaNext){kanaIndex=(kanaIndex+1+Math.floor(Math.random()*(KANA.length-1)))%KANA.length;kana();return}
if(el.dataset.kanaCheck){let actual=($('#kanaInput')?.value||'').trim().toLowerCase();let correct=actual===KANA[kanaIndex].rom;let n=$('#kanaFeedback');n.innerHTML=`<div class="check ${correct?'good':'bad'}">${correct?'✓ 正确！':'答案：'+esc(KANA[kanaIndex].rom)}。点击「下一题」继续。</div>`;state.kana.attempts=(state.kana.attempts||0)+1;if(correct)state.kana.correct=(state.kana.correct||0)+1;save();return}
if(el.dataset.reveal){reveal=true;review();return}
if(el.dataset.reviewSpeak){if(currentReview)speak(currentReview.front,currentReview.lang);return}
if(el.dataset.rate){if(!currentReview)return;let old=state.cards[currentReview.id]||{step:0};let rate=el.dataset.rate;let step=rate==='good'?Math.min(old.step+1,6):rate==='hard'?Math.max(0,old.step):0;let intervals=[1,3,7,14,30,60,100];let days=rate==='again'?0:rate==='hard'?1:intervals[step];state.cards[currentReview.id]={step,due:futureDate(days),last:dateId()};currentReview=null;reveal=false;save();review();return}
if(el.dataset.goal!==undefined)return;
if(el.dataset.passLevel){let l=state.lang;state.level[l]=Math.min(5,state.level[l]+1);save();toast('已切换到下一阶段');render();return}
if(el.dataset.addLog){logMin($('#logKind')?.value||'course',state.lang,$('#logMinutes')?.value);return}
if(el.dataset.saveSettings){state.dailyMinutes=Number($('#minutes')?.value||state.dailyMinutes);state.englishRatio=Number($('#ratio')?.value||state.englishRatio);state.playback=Number($('#rate')?.value||state.playback);for(let l of ['en','ja'])state.level[l]=Number($('#level_'+l)?.value??state.level[l]);save();toast('学习设置已保存');render();return}
if(el.dataset.export){exportData();return}
if(el.dataset.shareBackup){shareBackup();return}
if(el.dataset.filmSub){state.subVisible=!state.subVisible;save();el.textContent=state.subVisible?'隐藏字幕':'显示字幕';updateFilmTime();let c=$('#filmSubtitle');if(c)c.textContent=state.subVisible&&selectedCue>=0?cues[selectedCue].t:'';return}
let vid=$('#filmVideo');
if(el.dataset.setA){if(!vid||!movieUrl)return toast('请先导入视频');loopA=vid.currentTime;updateLoopInfo();return}
if(el.dataset.setB){if(!vid||!movieUrl)return toast('请先导入视频');loopB=vid.currentTime;updateLoopInfo();return}
if(el.dataset.loop){if(loopA===null||loopB===null||loopB<=loopA)return toast('请先设置 A 和晚于 A 的 B');loopOn=!loopOn;el.textContent=loopOn?'■ 关闭循环':'↻ A-B 循环';el.classList.toggle('orange',loopOn);if(loopOn&&vid){vid.currentTime=loopA;vid.play().catch(()=>{})}return}
if(el.dataset.clearLoop){loopA=loopB=null;loopOn=false;updateLoopInfo();render();return}
if(el.dataset.seekCue!==undefined){let i=Number(el.dataset.seekCue);if(cues[i]&&vid){vid.currentTime=cues[i].start;selectedCue=i;vid.play().catch(()=>{});updateFilmTime()}return}
if(el.dataset.checkFilm){let c=cues[selectedCue],n=$('#filmFeedback');if(!c){toast('先导入字幕并选中一个片段');return}let draft=$('#filmDict')?.value||'',score=sim(normalize(draft,state.lang),normalize(c.t,state.lang));n.innerHTML=`<div class="check ${score>=.82?'good':'bad'}">字面匹配约 ${Math.round(score*100)}%，请核对遗漏与音变。<br><b>字幕参考：</b>${esc(c.t)}</div>`;return}
if(el.dataset.addFilm){if(!movieUrl)return toast('请先导入素材');let c=cues[selectedCue];state.filmTasks[state.lang]??=[];state.filmTasks[state.lang].push({file:movieName||'本地素材',date:dateId(),time:c?fmtTime(c.start):fmtTime(vid?.currentTime||0),text:c?.t||'无字幕片段',note:$('#filmDict')?.value?.trim()||''});save();toast('已保存片段练习');return}
if(el.dataset.logFilm){logMin('film',state.lang,$('#filmMinutes')?.value);return}
};
root.onchange=async(ev)=>{let el=ev.target;if(el.id==='importFile'&&el.files[0]){await importData(el.files[0]);return}
if(el.id==='movieFile'&&el.files[0]){if(movieUrl)URL.revokeObjectURL(movieUrl);movieUrl=URL.createObjectURL(el.files[0]);movieName=el.files[0].name;let v=$('#filmVideo');if(v){v.src=movieUrl;v.load()}let n=$('#filmName');if(n)n.textContent=movieName;toast('本地素材已加载，不会上传');return}
if(el.id==='subtitleFile'&&el.files[0]){try{let t=await el.files[0].text();cues=parseSubs(t);selectedCue=-1;$('#cueList').innerHTML=renderCueList()||'<p class="muted">未识别到标准 SRT/VTT 字幕时间轴。</p>';$('#cueCount').textContent=cues.length+' 句';$('#cueInfo').textContent=cues.length?`已载入 ${cues.length} 句，第一遍建议隐藏字幕。`:'没有解析出字幕，请检查格式。';toast('已载入 '+cues.length+' 句字幕')}catch(e){toast('字幕解析失败：'+e.message)}return}
if(el.id==='filmRate'){let v=$('#filmVideo');if(v)v.playbackRate=Number(el.value);return}
if(el.dataset.goal!==undefined){let key=state.lang+'-'+state.level[state.lang];state.goals[key]??={};state.goals[key][el.dataset.goal]=el.checked;save();assessment();return}
};
root.oninput=e=>{if(e.target.id==='ratio'){let label=$('#ratioLabel');if(label)label.textContent=e.target.value+'%'}};
root.onfocusin=e=>{if(e.target.matches('input:not([type=checkbox]):not([type=range]),textarea,select'))document.body.classList.add('iphone-keyboard')};
root.onfocusout=e=>{setTimeout(()=>{if(!root.contains(document.activeElement) || !document.activeElement.matches('input:not([type=checkbox]):not([type=range]),textarea,select'))document.body.classList.remove('iphone-keyboard')},100)};
root.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='kanaInput')root.querySelector('[data-kana-check]')?.click()};
}
function updateLoopInfo(){let n=$('#loopInfo');if(n)n.textContent='A '+fmtTime(loopA)+'　B '+fmtTime(loopB)+(loopB!==null&&loopA!==null&&loopB<=loopA?' · B 必须晚于 A':'')}
function render(){if(state.view==='dashboard')dashboard();else if(state.view==='curriculum')curriculum();else if(state.view==='lesson')lesson();else if(state.view==='review')review();else if(state.view==='kana')kana();else if(state.view==='cinema')cinema();else if(state.view==='assessment')assessment();else if(state.view==='records')records();else if(state.view==='settings')settings();else if(state.view==='install')install();else {state.view='dashboard';dashboard()}}
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
